# Configuración para publicar la API de Fastify en Render (Blueprint).
# Los valores secretos se escriben en el panel de Render, no aquí.
services:
  - type: web
    name: traza-api
    runtime: node
    plan: free
    rootDir: servidor
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/salud
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: ORIGENES_PERMITIDOS
        sync: false
